name: WEKO unit tests

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: JSON configuration filename under config/
        type: string
        default: modules.json
        required: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: modules
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          matrix=$(python3 scripts/module_config.py "$CONFIG_FILE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  images:
    name: Warm test image caches
    needs: modules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - name: Build and cache runner image
        id: runner_image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: image/runner.Dockerfile
          tags: weko-ut-runner:ci
          push: false
          outputs: type=cacheonly
          cache-to: type=gha,version=2,scope=weko-ut-runner-${{ github.run_id }},mode=max
      - name: Collect runner build log
        if: ${{ always() && steps.runner_image.outcome != 'skipped' }}
        run: docker buildx history logs --progress=plain > "$RUNNER_TEMP/image-build.log" 2>&1 || true
      - name: Build and cache OpenSearch image
        id: opensearch_image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: image/opensearch.Dockerfile
          tags: weko-ut-opensearch:ci
          push: false
          outputs: type=cacheonly
          cache-to: type=gha,version=2,scope=weko-ut-opensearch-${{ github.run_id }},mode=max
      - name: Collect OpenSearch build log
        if: ${{ always() && steps.opensearch_image.outcome != 'skipped' }}
        run: docker buildx history logs --progress=plain >> "$RUNNER_TEMP/image-build.log" 2>&1 || true
      - name: Save image build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-build-log
          path: ${{ runner.temp }}/image-build.log

  test:
    name: ${{ matrix.module }}
    needs: [modules, images]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: ci
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - name: Build runner image from cache
        id: runner_image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./ci
          file: ./ci/image/runner.Dockerfile
          tags: weko-ut-runner:ci
          push: false
          cache-from: type=gha,version=2,scope=weko-ut-runner-${{ github.run_id }}
          load: true
      - name: Collect runner build log
        if: ${{ always() && steps.runner_image.outcome != 'skipped' }}
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "reports/$MODULE"
          docker buildx history logs --progress=plain > "reports/$MODULE/image-build.log" 2>&1 || true
      - name: Build OpenSearch image from cache
        id: opensearch_image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./ci
          file: ./ci/image/opensearch.Dockerfile
          tags: weko-ut-opensearch:ci
          push: false
          cache-from: type=gha,version=2,scope=weko-ut-opensearch-${{ github.run_id }}
          load: true
      - name: Collect OpenSearch build log
        if: ${{ always() && steps.opensearch_image.outcome != 'skipped' }}
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: docker buildx history logs --progress=plain >> "reports/$MODULE/image-build.log" 2>&1 || true
      - name: Run module c1 tests
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "reports/$MODULE"
          set -o pipefail
          bash scripts/run-module.sh "$MODULE" ../source 2>&1 | tee "reports/$MODULE/run.log"
      - name: Collect service logs and clean up
        if: always()
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "reports/$MODULE"
          docker compose logs --no-color > "reports/$MODULE/services.log" 2>&1 || true
          docker compose down -v --remove-orphans
      - name: Save module reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: module-${{ matrix.module }}
          path: ci/reports/${{ matrix.module }}/
          include-hidden-files: true

  report:
    if: ${{ !cancelled() && needs.modules.result == 'success' }}
    needs: [modules, images, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: module-*
          path: reports/raw
      - name: Include image build log
        if: always()
        uses: actions/download-artifact@v8.0.2
        with:
          name: image-build-log
          path: reports/build
      - name: Create combined report
        if: always()
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: python3 scripts/aggregate.py "$CONFIG_FILE"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-test-report
          path: reports/
          include-hidden-files: true
