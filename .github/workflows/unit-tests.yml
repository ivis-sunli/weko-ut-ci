name: WEKO unit tests

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: JSON configuration filename under config/
        type: string
        default: modules.json
        required: true

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: modules
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          matrix=$(python3 scripts/module_config.py "$CONFIG_FILE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: ci
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
      - name: Run module c1 tests
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "reports/$MODULE"
          set -o pipefail
          bash scripts/run-module.sh "$MODULE" ../source 2>&1 | tee "reports/$MODULE/run.log"
      - name: Collect service logs and clean up
        if: always()
        working-directory: ci
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p "reports/$MODULE"
          docker compose logs --no-color > "reports/$MODULE/services.log" 2>&1 || true
          docker compose down -v --remove-orphans
      - name: Save module reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: module-${{ matrix.module }}
          path: ci/reports/${{ matrix.module }}/
          include-hidden-files: true

  report:
    if: always() && needs.modules.result == 'success'
    needs: [modules, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: module-*
          path: reports/raw
      - name: Create combined report
        if: always()
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: python3 scripts/aggregate.py "$CONFIG_FILE"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unit-test-report
          path: reports/
          include-hidden-files: true
